[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "execution-finality-reference"
version = "0.1.0"
description = "Runnable reference implementation of act-bound execution finality for agentic AI and industrial consequence boundaries"
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
